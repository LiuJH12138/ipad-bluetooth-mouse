<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPad 控制台</title>
  <link rel="icon" type="image/x-icon" href="/console.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1><img src="/console.ico" width="32" height="32" alt="">iPad 控制台</h1>
      <span class="local">本机工作台</span>
    </div>
  </header>
  <main>
    <div class="workspace">
      <section id="monitor" class="monitor" aria-labelledby="preview-heading">
        <div class="monitor-head">
          <h2 id="preview-heading">屏幕预览</h2>
          <span class="signal"><i id="video-dot" aria-hidden="true"></i><span id="video-status">等待画面</span></span>
        </div>
        <div id="stage">
          <canvas id="usb-canvas" hidden aria-label="iPad USB 实时画面"></canvas>
          <video id="video" autoplay muted playsinline aria-label="共享窗口实时画面"></video>
          <div id="placeholder">
            <div class="connection-drawing" aria-hidden="true"><span class="cable"></span><span class="plug"></span><span class="device"></span></div>
            <h3>等待 iPad 画面</h3>
            <p>用数据线连接并解锁 iPad，再点「USB 直连」</p>
          </div>
        </div>
        <div class="transport">
          <div class="transport-state"><span id="mode-label">预览模式</span><small><kbd>Esc</kbd> 退出控制</small></div>
          <div class="actions">
            <button id="fullscreen" aria-controls="monitor" disabled>全屏</button>
            <button id="release" hidden>结束控制</button>
            <button id="control" class="action" disabled>开始键鼠控制</button>
          </div>
        </div>
        <p id="fullscreen-error" role="status"></p>
      </section>
      <aside class="inspector" aria-label="设备连接和设置">
        <h2>设备连接</h2>
        <p id="notice" role="status" aria-live="polite"></p>
        <section class="channel">
          <h3><span class="port" aria-hidden="true"></span>画面来源</h3>
          <div class="sources">
            <button id="usb" class="action">USB 直连</button>
            <button id="share">共享已有窗口</button>
          </div>
          <button id="stop-share" class="text-button" disabled hidden>停止共享</button>
        </section>
        <section class="channel">
          <h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg>蓝牙输入</h3>
          <dl class="readings">
            <div><dt>蓝牙</dt><dd id="bluetooth-status">尚未启动</dd></div>
            <div><dt>键盘</dt><dd id="keyboard-status">尚未连接</dd></div>
          </dl>
          <button id="connect">连接蓝牙</button>
          <button id="disconnect" disabled hidden>断开蓝牙</button>
          <p class="hint">首次配对时，在 iPad 的蓝牙设置中选择这台电脑。</p>
        </section>
        <section class="channel">
          <h3>键鼠设置</h3>
          <label class="check"><input id="command-control" type="checkbox" checked>将 Ctrl 映射为 iPad Command</label>
          <label class="range-label" for="speed">指针速度 <output for="speed" id="speed-value">1.0×</output></label>
          <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1">
          <details class="input-help"><summary>输入与快捷键</summary><p>输入中文时，将电脑切到英文输入法，再用 iPad 输入法选字。Win、Alt+Tab 等系统快捷键由电脑处理。</p></details>
        </section>
      </aside>
    </div>
    <section class="tools" aria-label="辅助工具">
      <details class="tool">
        <summary>备用触控板</summary>
        <div class="tool-body">
          <div id="touchpad" aria-label="iPad 触控板">拖动移动指针，轻点点击</div>
          <div class="actions"><button id="tap" disabled>左键点击</button><button id="up" disabled>向上滚动</button><button id="down" disabled>向下滚动</button><button id="search" disabled>打开 iPad 搜索</button></div>
        </div>
      </details>
      <details class="tool">
        <summary>截图与助手读取</summary>
        <div class="tool-body">
          <button id="snapshot" disabled>保存当前画面 PNG</button>
          <label class="check"><input id="frames" type="checkbox">允许本机自动化读取当前画面</label>
          <p class="hint">每秒最多更新两帧，在本机内存保留 4 秒。关闭后清空。助手读取后的处理取决于你使用的服务。</p>
        </div>
      </details>
    </section>
  </main>
  <script src="/usb-video.js"></script>
  <script src="/keyboard.js"></script>
  <script src="/app.js"></script>
</body>
</html>
