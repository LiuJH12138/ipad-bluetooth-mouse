<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone / iPad 控制台</title>
  <link rel="icon" type="image/x-icon" href="/console.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="workspace">
    <aside id="inspector" class="inspector" aria-label="设备连接和设置">
      <header class="masthead">
        <img src="/console.ico" width="26" height="26" alt="">
        <h1>设备</h1>
      </header>
      <section class="panel connections" aria-label="设备连接">
        <div class="connection-card">
          <div class="connection-row">
            <span class="row-symbol display-symbol" aria-hidden="true"></span>
            <div class="connection-name">USB 投屏<small><i id="video-dot" aria-hidden="true"></i><span id="source-status">未连接</span></small></div>
          </div>
          <div class="connection-row">
            <span class="row-symbol bluetooth-symbol" aria-hidden="true"><svg width="14" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12-6 4V2l6 4L6 18"/></svg></span>
            <div class="connection-name">蓝牙键鼠<small id="bluetooth-status">未连接</small></div>
            <button id="connect" class="inline-action" aria-label="连接蓝牙">连接</button>
          </div>
        </div>
        <p id="pairing-help" class="hint" hidden></p>
        <details class="disclosure">
          <summary>连接详情</summary>
          <div class="detail-content">
            <dl class="metrics">
              <div id="keyboard-row" hidden><dt>键盘</dt><dd id="keyboard-status">未连接</dd></div>
              <div><dt>投屏</dt><dd id="video-status">等待画面</dd></div>
              <div id="verification-row" hidden><dt>定位</dt><dd id="verification-result"></dd></div>
              <div id="input-row" hidden><dt>上次操作</dt><dd id="input-result"></dd></div>
            </dl>
            <form id="device-alias" hidden>
              <label for="alias-input">本机别名</label>
              <div class="alias-fields"><input id="alias-input" maxlength="32" autocomplete="off" placeholder="留空使用设备名称"><button id="save-alias" type="submit">保存</button></div>
              <p id="alias-result" role="status"></p>
            </form>
            <button id="stop-usb" hidden>停止投屏</button>
          </div>
        </details>
      </section>
      <section id="position-panel" class="panel" aria-labelledby="position-heading" hidden>
        <div class="section-line"><h2 id="position-heading">指针定位</h2><p id="position-status"></p></div>
        <p id="position-detail" class="hint" aria-live="polite"></p>
        <button id="verify-position">验证坐标</button>
        <button id="confirm-relative" hidden>我已看到指针移动</button>
        <button id="refresh-pairing" hidden>刷新连接</button>
      </section>
      <details class="panel settings">
        <summary>键鼠设置</summary>
        <label class="check"><span>将 Ctrl 映射为 Command</span><input id="command-control" type="checkbox" role="switch" checked></label>
        <label class="range-label" for="speed">键鼠控制速度 <output for="speed" id="speed-value">1.0×</output></label>
        <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1">
      </details>
    </aside>
    <section id="monitor" class="monitor" aria-labelledby="preview-heading">
      <header class="monitor-head">
        <div class="window-title">
          <button id="toggle-inspector" aria-label="收起设备侧栏" title="收起设备侧栏" aria-controls="inspector" aria-expanded="true"><span aria-hidden="true"></span></button>
          <div class="target-title"><h2 id="preview-heading"><span id="preview-name">设备屏幕</span><small id="preview-code"></small></h2><small id="target-state" hidden></small></div>
        </div>
        <div class="preview-tools"><span id="active-usb-action"></span><button id="fullscreen" aria-controls="monitor" hidden>全屏</button></div>
      </header>
      <dialog id="device-picker" aria-labelledby="device-picker-title">
        <h3 id="device-picker-title" tabindex="-1" autofocus>选择 USB 设备</h3>
        <p id="device-picker-status" role="status"></p>
        <div id="device-list"></div>
        <div class="row-actions">
          <button id="refresh-devices">刷新</button>
          <button id="close-devices">取消</button>
        </div>
      </dialog>
      <div id="stage">
        <canvas id="usb-canvas" tabindex="-1" hidden aria-label="设备 USB 实时画面"></canvas>
        <div id="fullscreen-target" hidden><span id="fullscreen-name"></span><span id="fullscreen-code"></span><span id="fullscreen-state"></span></div>
        <textarea id="picture-keyboard" tabindex="-1" aria-label="设备画面键盘" autocomplete="off" autocapitalize="off" spellcheck="false" disabled></textarea>
        <div id="placeholder">
          <div class="pairing-art" aria-hidden="true">
            <div class="tablet"><div class="tablet-display"><i></i><b></b><em></em></div></div>
            <div class="usb-cable"></div>
          </div>
          <h3 id="connection-heading">连接 iPhone 或 iPad</h3>
          <p id="connection-instruction">用 USB 数据线连接并解锁设备。需要键鼠时，选「一键配置」。</p>
          <p id="opening-progress" role="status" hidden></p>
          <div id="start-actions" class="start-actions">
            <button id="setup-start" class="primary">一键配置</button>
            <span id="idle-usb-action"><button id="usb">仅投屏</button></span>
          </div>
          <button id="cancel-opening" hidden>取消连接</button>
        </div>
        <section id="setup-panel" class="setup-panel" aria-labelledby="setup-title" hidden>
          <h3 id="setup-title" tabindex="-1">正在检测</h3>
          <p id="setup-target" hidden></p>
          <p id="setup-detail" role="status"></p>
          <div id="setup-devices" class="setup-devices"></div>
          <a id="setup-store" href="https://apps.microsoft.com/detail/9np83lwlpz9k" target="_blank" rel="noopener noreferrer" hidden>获取 Apple 设备 ↗</a>
          <div class="setup-actions">
            <button id="setup-next" hidden></button>
            <button id="setup-skip" hidden>仅投屏</button>
            <button id="setup-cancel">取消配置</button>
          </div>
        </section>
      </div>
      <div id="transport" class="transport" hidden>
        <div class="actions">
          <details id="mode-picker" class="mode-picker">
            <summary id="mode-summary"><span>操控方式</span><strong id="mode-current">仅预览</strong></summary>
            <div class="mode-options" role="group" aria-label="操控方式">
              <button id="preview-mode" aria-pressed="true">仅预览</button>
              <button id="point" aria-pressed="false">画面操控</button>
              <button id="control" aria-pressed="false">键鼠控制</button>
            </div>
          </details>
          <small id="capture-hint" hidden>按 Esc 释放键鼠</small>
          <button id="assistant" aria-pressed="false" title="允许本机助手读图和发送键鼠操作">允许助手控制</button>
        </div>
      </div>
      <p id="fullscreen-error" role="status"></p>
      <p id="notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/usb-video.js"></script>
  <script src="/keyboard.js"></script>
  <script src="/pointing.js"></script>
  <script src="/absolute-pointer.js"></script>
  <script src="/mouse-gestures.js"></script>
  <script src="/app.js"></script>
  <script src="/setup.js"></script>
</body>
</html>
